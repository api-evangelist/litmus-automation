aid: litmus-automation
name: Litmus Automation
description: 'Litmus Automation (Litmus) is an industrial data platform company that
  helps manufacturers connect industrial systems, standardize operational data, and
  deploy analytics, AI, and automation at scale across plant locations. Its products
  are Litmus Edge (an industrial edge data platform for device connectivity, DataOps,
  edge intelligence, and analytics), Litmus Edge Manager (centralized fleet management
  for distributed edge deployments), and Litmus Unify (an MQTT-based Unified Namespace).
  Litmus exposes a large public API surface — roughly 2,004 endpoints across the three
  products (REST plus newer GraphQL areas), OAuth2 client-credentials authentication,
  a standalone litmus-cli, a Python SDK, and an open-source Model Context Protocol
  (MCP) server for agentic access. Backed by Insight Partners.'
